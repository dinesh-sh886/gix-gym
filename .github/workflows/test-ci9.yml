name: Test CI 9
on:
  push:
    branches: [master]
jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: echo "build step"
  docker-compose-config:
    name: Docker Compose Config Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ hashFiles('infrastructure/docker/compose.yml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "docker compose config check"
  status-report:
    name: Status Report
    runs-on: ubuntu-latest
    needs: [build-and-verify, docker-compose-config]
    if: always()
    steps:
      - run: echo "status report"
