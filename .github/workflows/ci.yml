name: CI - Gix Gym

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

env:
  MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss"
  SPRING_PROFILES_ACTIVE: ci

jobs:
  build-and-verify:
    name: Build & Verify (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      # No secrets needed for local-first build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for versions-maven-plugin, git history analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Print Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Validate Maven wrapper / project
        run: mvn -ntp -B validate --file pom.xml

      - name: Run Enforcer (Java 21, Maven 3.9+, no duplicate deps)
        run: mvn -ntp -B enforcer:enforce@enforce-java --file pom.xml

      - name: Compile and Test
        run: mvn -ntp -B verify -pl services/membership -am --file pom.xml

      - name: Checkstyle
        run: mvn -ntp -B checkstyle:check -pl services/membership
        continue-on-error: true  # non-blocking until baseline established

      - name: SpotBugs
        run: mvn -ntp -B spotbugs:check -pl services/membership
        continue-on-error: true  # non-blocking until baseline established

      - name: Verify OpenAPI specs (if any)
        run: |
          if [ -d "contracts/openapi" ] && [ "$(ls -A contracts/openapi/*.yaml 2>/dev/null)" ]; then
            echo "Validating OpenAPI specs..."
            # Requires swagger-codegen or similar; skip if not installed
            # npx @redocly/cli@latest lint contracts/openapi/*.yaml || true
            echo "OpenAPI validation placeholder — add tooling when specs exist"
          else
            echo "No OpenAPI specs found yet — skipping"
          fi

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "--verbose --redact"
        continue-on-error: true  # non-blocking until baseline established

  docker-compose-config:
    name: Docker Compose Config Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo apt-get update && sudo apt-get install -y docker-compose-plugin

      - name: Validate Compose syntax
        if: ${{ hashFiles('infrastructure/docker/compose.yml') != '' }}
        run: docker compose -f infrastructure/docker/compose.yml config --quiet
        continue-on-error: true  # Docker may not be fully functional in CI runner

  status-report:
    name: P01 Status Summary
    runs-on: ubuntu-latest
    needs: [build-and-verify, docker-compose-config]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print status summary
        run: |
          echo "=== P01 CI Summary ==="
          echo "Build & Verify: ${{ needs.build-and-verify.result }}"
          echo "Docker Compose: ${{ needs.docker-compose-config.result }}"
          if [ -f docs/status/P01-status.md ]; then
            echo "---"
            cat docs/status/P01-status.md
          fi